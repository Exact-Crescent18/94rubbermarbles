name: Update race results

"on":
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # safety net against a genuine hang; raised from 8 since a real backlog
                         # (many unresolved events x up to 3 retries x 4-16s backoff, plus 11
                         # series' worth of ticker calls) can legitimately take a while to churn
                         # through in one run — 8 min was killing runs mid-backlog, not just hangs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run updater
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLACKTOP_API_KEY: ${{ secrets.BLACKTOP_API_KEY }}
        run: node scripts/update-results.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes."
            exit 0
          fi
          git config user.name "apexwire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update: race results / ticker refresh"
          git push
